name: Backend Staging CI/CD v2

on:
  push:
    branches:
      - staging
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js (WITHOUT pnpm cache first)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "backend/pnpm-lock.yaml"

      # Step 3: Install pnpm using official action
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 #

      # Step 4: Get pnpm store directory for caching
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Step 5: Setup pnpm cache
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Step 6: Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      # Step 7: Run linter
      - name: Run linter
        run: pnpm run lint
        working-directory: backend

      # Step 8: Type check
      - name: Type check
        run: pnpm run type-check || npx tsc --noEmit
        working-directory: backend

      # Step 10: Build backend
      - name: Build backend
        run: pnpm run build
        working-directory: backend

      # Step 12: Deploy to Render (ONLY if all above steps passed)
      - name: Deploy to Render (staging)
        if: success()
        run: |
          echo " Deploying to Render..."
          curl -X POST "${{ secrets.RENDER_BACKEND_STAGING_HOOK }}"
          echo "Deployment triggered!"
