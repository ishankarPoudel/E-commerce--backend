name: Backend Staging CI/CD v2

on:
  push:
    branches:
      - staging
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install pnpm FIRST
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Step 3: Setup Node.js (with pnpm already installed)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 4: Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      # Step 5: Run linter
      - name: Run linter
        run: pnpm run lint
        working-directory: backend

      # Step 6: Type check
      - name: Type check
        run: pnpm run type-check || npx tsc --noEmit
        working-directory: backend

      # Step 7: Build backend
      - name: Build backend
        run: pnpm run build
        working-directory: backend
        env:
          NODE_ENV: production

      # Step 8: Validate build output
      - name: Validate build output
        working-directory: backend
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.js" ]; then
            echo "Build validation failed! Missing dist folder or index.js"
            exit 1
          fi
          echo "Build output is valid!"

      # Step 9: Deploy to Render (only if all previous steps pass)
      - name: Deploy to Render (staging)
        if: success()
        run: |
          echo "🚀 Deploying to Render..."
          curl -X POST "${{ secrets.RENDER_BACKEND_STAGING_HOOK }}"
          echo " Deployment triggered successfully!"
